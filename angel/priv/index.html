<!doctype html>
<html lang="es-CL" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- Fija la ruta base: en roang.cl la app vive en /angel/priv (sin barra final) y en local en / -->
  <script>document.write('<base href="' + location.pathname.replace(/index\.html$/, '').replace(/\/?$/, '/') + '">');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b18">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Mi Vida · Ángel</title>
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" type="image/png" href="assets/brand/favicon-256.png">
  <link rel="apple-touch-icon" href="assets/brand/roang-icon-dark-512.webp">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/unbounded-latin.woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Mismo tema guardado que el portafolio, aplicado antes de pintar */
    try { var t = localStorage.getItem('ag-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="barra-sup">
      <a class="logo" href="#hoy" aria-label="Mi Vida, ir a Hoy">
        <img class="logo-dark" src="assets/brand/roang-wordmark-white.webp" alt="" width="720" height="136">
        <img class="logo-light" src="assets/brand/roang-wordmark-black.webp" alt="" width="720" height="136">
        <span class="etiqueta-priv">Privado</span>
      </a>
      <nav id="nav" aria-label="Secciones"></nav>
      <div class="fin-barra">
        <button type="button" class="icon-btn" id="btn-bloquear" data-act="bloquear" aria-label="Bloquear" title="Bloquear" hidden>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </button>
        <button type="button" class="icon-btn" data-act="tema" aria-label="Cambiar tema" title="Cambiar tema">
          <svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app"></main>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="bloqueo" class="bloqueo" hidden></div>

  <script src="js/core.js"></script>
  <script src="js/hoy.js"></script>
  <script src="js/rutinas.js"></script>
  <script src="js/calendario.js"></script>
  <script src="js/metas.js"></script>
  <script src="js/fe.js"></script>
  <script src="js/finanzas.js"></script>
  <script src="js/ajustes.js"></script>
  <script src="js/bloqueo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
